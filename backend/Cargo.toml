[package]
name = "rift-backend"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "Rift realtime authoritative game-session server"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
dotenvy = "0.15.7"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
native-tls = { version = "0.2", optional = true }
mysql_async = { version = "0.37", default-features = false, features = ["minimal-rust", "rustls-tls", "ring", "tls12"], optional = true }
postgres-native-tls = { version = "0.5", optional = true }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "native-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime", "with-chrono-0_4", "with-serde_json-1", "with-uuid-1"], optional = true }
tokio = { version = "1.53.2", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.27.0", features = ["serde", "v4", "v5"] }

[dev-dependencies]
tokio-tungstenite = "0.29.0"
tower = { version = "0.5", features = ["util"] }

[features]
# TiDB (MySQL protocol) persistence for NPC memory/state. Off by default so the
# default build and tests stay lean and fully offline.
tidb = ["dep:mysql_async", "tokio/time"]
# Tiger Data (TimescaleDB / PostgreSQL) gameplay telemetry. Off by default: the
# default build keeps telemetry in memory.
tiger = ["dep:tokio-postgres", "dep:postgres-native-tls", "dep:native-tls"]
